# Every 30 minutes: post whatever is due in schedule.json to Instagram and the Facebook Page.
# Also runnable by hand (Actions › Post › Run workflow): "check" = test without publishing, "whoami" = check the key.
name: Post
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post (normal), check (test, publishes nothing) or whoami (check the Meta key)"
        default: check
        type: choice
        options: [check, whoami, post]
permissions:
  contents: write
concurrency:
  group: poster
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        run: |
          case "${{ github.event.inputs.mode || 'post' }}" in
            whoami) node poster/whoami.mjs ;;
            check)  node poster/post.mjs --check ;;
            *)      node poster/post.mjs ;;
          esac
      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "job-shift-poster"
          git config user.email "actions@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "Posted: update state" && git pull --rebase && git push)
